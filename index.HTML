<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الكارت الصحي - مسح QR ورفع صورة</title>
  <style>
    :root{--accent:#0b6fb1;--bg-filter:rgba(255,255,255,0.75)}
    *{box-sizing:border-box;font-family:Tahoma,'Segoe UI',Arial,sans-serif}
    body{
      margin:0;min-height:100vh;display:flex;flex-direction:column;
      background-size:cover;background-position:center;
    }
    header{
      display:flex;align-items:center;justify-content:center;padding:12px 18px;background:rgba(255,255,255,0.6);box-shadow:0 2px 8px rgba(0,0,0,0.1)
    }
    .logo{display:flex;align-items:center;gap:12px}
    .logo img{height:64px;width:auto;border-radius:8px}
    .title{font-size:20px;font-weight:700;color:#073b57}

    main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
    .card{width:100%;max-width:900px;background:rgba(255,255,255,0.88);border-radius:14px;padding:18px;box-shadow:0 8px 30px rgba(0,0,0,0.12)}
    .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
    button{background:var(--accent);color:#fff;border:0;padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer}
    button.secondary{background:transparent;color:var(--accent);border:2px solid var(--accent)}

    #videoPreview{width:100%;max-width:640px;border-radius:8px;background:#000;display:none}
    #imgPreview{max-width:320px;border-radius:8px;display:none;margin-top:10px}
    #qrResult{margin-top:15px;font-weight:600;color:#044;font-size:16px;text-align:center}

    .hint{font-size:13px;color:#333;margin-top:10px;text-align:center}
    footer{padding:10px 18px;text-align:center;font-size:13px;color:#044}

    @media(max-width:640px){.card{padding:12px}.logo img{height:50px}.title{font-size:17px}}
  </style>
</head>
<body background="image.png">
  <header>
    <div class="logo">
      <img src="undefined.jpg" " alt="شعار وزارة الصحة">
      <div class="title">وزارة الصحة - الكارت الصحي الذكي</div>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="actions">
        <button id="openCamBtn">فتح الكاميرا (QR)</button>
        <label for="fileInput"><button type="button" class="secondary">رفع صورة</button></label>
        <input id="fileInput" type="file" accept="image/*" style="display:none">
        <button id="closeCamBtn" style="display:none">إغلاق الكاميرا</button>
      </div>

      <video id="videoPreview" autoplay playsinline></video>
      <img id="imgPreview" alt="معاينة الصورة المرفوعة">
      <div id="qrResult"></div>

      <p class="hint">يمكنك مسح رمز QR بالكاميرا أو رفع صورة تحتوي على QR وسيتم قراءتها تلقائيًا.</p>
    </div>
  </main>

  <footer>© وزارة الصحة المصرية - 2025</footer>

  <!-- مكتبة قراءة QR -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
  <script>
    const openCamBtn = document.getElementById('openCamBtn');
    const closeCamBtn = document.getElementById('closeCamBtn');
    const video = document.getElementById('videoPreview');
    const fileInput = document.getElementById('fileInput');
    const imgPreview = document.getElementById('imgPreview');
    const qrResult = document.getElementById('qrResult');
    let stream = null;
    let scanInterval;

    openCamBtn.addEventListener('click', async ()=>{
      try{
        stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
        video.srcObject = stream;
        video.style.display='block';
        closeCamBtn.style.display='inline-block';
        qrResult.textContent='جاري المسح...';
        const canvas=document.createElement('canvas');
        const ctx=canvas.getContext('2d');
        scanInterval=setInterval(()=>{
          if(video.readyState===video.HAVE_ENOUGH_DATA){
            canvas.width=video.videoWidth;
            canvas.height=video.videoHeight;
            ctx.drawImage(video,0,0,canvas.width,canvas.height);
            const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
            const code=jsQR(imgData.data,canvas.width,canvas.height);
            if(code){
              qrResult.textContent='نتيجة QR: '+code.data;
              clearInterval(scanInterval);
            }
          }
        },500);
      }catch(err){
        alert('تعذر فتح الكاميرا، تحقق من الأذونات');
      }
    });

    closeCamBtn.addEventListener('click',()=>{
      if(stream){stream.getTracks().forEach(t=>t.stop());}
      video.style.display='none';closeCamBtn.style.display='none';clearInterval(scanInterval);
      qrResult.textContent='';
    });

    fileInput.addEventListener('change',e=>{
      const file=e.target.files[0];if(!file)return;
      const reader=new FileReader();
      reader.onload=function(){
        imgPreview.src=reader.result;imgPreview.style.display='block';
        const image=new Image();
        image.onload=function(){
          const canvas=document.createElement('canvas');
          const ctx=canvas.getContext('2d');
          canvas.width=image.width;canvas.height=image.height;
          ctx.drawImage(image,0,0,image.width,image.height);
          const imgData=ctx.getImageData(0,0,image.width,image.height);
          const code=jsQR(imgData.data,image.width,image.height);
          if(code){qrResult.textContent='نتيجة QR: '+code.data;}else{qrResult.textContent='لم يتم العثور على رمز QR في الصورة';}
        };
        image.src=reader.result;
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
